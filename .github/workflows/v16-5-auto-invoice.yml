name: V16.5 automatic invoice fields
on:
  push:
    branches: [feature/auto-invoice-fields-v16-5]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply updater
        run: python scripts/v16_5_auto_invoice_fields.py
      - name: Install requirements
        run: python -m pip install -r requirements.txt 'pytest>=8,<10'
      - name: Compile
        run: python -m compileall -q inventory_tracker.py gp_ui.py gp_store.py gp_ocr.py invoice_ocr_worker.py
      - name: Regression suite
        run: python -m pytest -o addopts='' -q
      - name: Validate markers
        run: |
          python - <<'PY'
          from pathlib import Path
          app=Path('inventory_tracker.py').read_text()
          ui=Path('gp_ui.py').read_text()
          assert 'auto_invoice=bool(draft.get("image_hash"))' in app
          assert 'duplicate_action=' not in app
          assert 'GP-CLOUD-v16.5' in ui
          print('v16.5 markers OK')
          PY
      - name: Commit validated source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inventory_tracker.py gp_ui.py gp_ocr.py invoice_ocr_worker.py tests/test_core_and_ocr.py
          git diff --cached --quiet || git commit -m 'feat: automate invoice metadata and duplicate handling v16.5'
          git push
