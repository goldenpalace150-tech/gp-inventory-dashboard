name: Release integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-live-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install requirements
        run: python -m pip install -r requirements.txt 'pytest>=8,<10'
      - name: Compile application
        run: python -m compileall -q inventory_tracker.py gp_ui.py gp_store.py gp_ocr.py invoice_ocr_worker.py
      - name: Regression suite
        run: python -m pytest -o addopts='' -q
      - name: Verify deployment source and build label
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast

          ui = Path('gp_ui.py').read_text(encoding='utf-8')
          tree = ast.parse(ui)
          assignments = []
          for node in tree.body:
              if isinstance(node, ast.Assign):
                  for target in node.targets:
                      if isinstance(target, ast.Name) and target.id == 'BUILD':
                          assignments.append(node.value.value if isinstance(node.value, ast.Constant) else None)
          assert len(assignments) == 1, f'BUILD must have one source of truth, found {assignments}'
          assert str(assignments[0]).startswith('GP-CLOUD-v')

          app = Path('inventory_tracker.py').read_text(encoding='utf-8')
          assert 'from gp_ui import (BUILD,' in app
          assert "if __name__==\"__main__\":" in app
          print('release integrity OK:', assignments[0])
          PY
