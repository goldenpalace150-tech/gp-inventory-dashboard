name: V16.2 baseline truth repair
on:
  push:
    branches: [warehouse-v16-2-baseline-truth]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply updater
        run: python scripts/v16_2_baseline_truth.py
      - name: Install requirements
        run: python -m pip install -r requirements.txt 'pytest>=8,<10'
      - name: Compile
        run: python -m compileall -q inventory_tracker.py gp_ui.py gp_store.py
      - name: Regression suite
        run: python -m pytest -o addopts='' -q
      - name: Validate baseline truth markers
        run: |
          python - <<'PY'
          from pathlib import Path
          store=Path('gp_store.py').read_text()
          ui=Path('gp_ui.py').read_text()
          assert '_repair_orphan_stock_without_baseline' in store
          assert 'if not c.execute(select(baselines.c.operation_id).limit(1)).first()' in store
          assert 'GP-CLOUD-v16.2' in ui
          print('v16.2 markers OK')
          PY
      - name: Commit validated source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gp_store.py gp_ui.py tests/test_core_and_ocr.py
          git diff --cached --quiet || git commit -m 'fix: clear orphan stock when no warehouse report exists v16.2'
          git push
