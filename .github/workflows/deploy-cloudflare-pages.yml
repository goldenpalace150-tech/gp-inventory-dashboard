name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - cloudflare-unified-operations
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@latest pages project create golden-palace-operations --production-branch cloudflare-unified-operations || true
          npx wrangler@latest pages deploy public --project-name golden-palace-operations --branch cloudflare-unified-operations --commit-dirty=true
