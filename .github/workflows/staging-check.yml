name: Staging validation
on:
  push:
    branches: [cloud-v5-staging, fix-libgl-runtime, fix-ocr-no-apt-test]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gp-staging-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify and assemble logo
        run: python scripts/assemble_assets.py
      - name: Install full app requirements
        run: python -m pip install -r requirements.txt
      - name: Compile application modules
        run: python -m compileall -q inventory_tracker.py gp_store.py gp_core.py gp_invoice.py gp_ocr.py gp_ui.py gp_reports.py gp_backup.py invoice_ocr_worker.py scripts
      - name: Run offline regression tests
        run: |
          python -m pip install 'pytest>=8,<10'
          python -m pytest -o addopts='' -q
      - name: Smoke test deployed OCR runtime
        run: |
          python - <<'PY'
          import cv2, onnxruntime
          from rapidocr import RapidOCR
          from PIL import Image, ImageDraw
          import numpy as np
          print('cv2', cv2.__version__)
          print('onnxruntime', onnxruntime.__version__)
          image = Image.new('RGB', (640, 220), 'white')
          draw = ImageDraw.Draw(image)
          draw.text((30, 60), '010716   3.00   8042', fill='black')
          engine = RapidOCR()
          result = engine(np.asarray(image))
          assert result is not None
          print('RapidOCR smoke OK', type(result).__name__)
          PY
      - name: Reproduce on clean Python 3.11 slim with no apt packages
        run: |
          docker run --rm -v "$PWD:/app" -w /app python:3.11-slim bash -lc '
            python -m pip install --upgrade pip >/dev/null &&
            python -m pip install -r requirements.txt >/dev/null &&
            python - <<"PY"
          import cv2, onnxruntime
          from rapidocr import RapidOCR
          import numpy as np
          print("slim cv2", cv2.__version__)
          print("slim onnxruntime", onnxruntime.__version__)
          result = RapidOCR()(np.full((180, 600, 3), 255, dtype=np.uint8))
          assert result is not None
          print("Clean slim OCR runtime passed")
          PY
          '
  publish-logo:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/cloud-v5-staging'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Assemble verified public asset
        run: python scripts/assemble_assets.py
      - name: Commit only the assembled logo to staging
        run: |
          git add -- assets/golden_palace.jpg
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: add checksum-verified Golden Palace logo'
          git push origin HEAD:cloud-v5-staging
