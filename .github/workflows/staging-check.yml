name: Staging validation
on:
  push:
    branches: [cloud-v5-staging, fix-libgl-runtime, fix-ocr-no-apt-test, warehouse-code-link-v9]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gp-staging-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply v9 source update for validation
        run: python scripts/v9_update.py
      - name: Verify and assemble logo
        run: python scripts/assemble_assets.py
      - name: Install full app requirements
        run: python -m pip install -r requirements.txt
      - name: Compile application modules
        run: python -m compileall -q inventory_tracker.py gp_store.py gp_core.py gp_invoice.py gp_ocr.py gp_ui.py gp_reports.py gp_backup.py invoice_ocr_worker.py scripts
      - name: Run offline regression tests
        run: |
          python -m pip install 'pytest>=8,<10'
          python -m pytest -o addopts='' -q
      - name: Test current warehouse report contract and code linking
        run: |
          python - <<'PY'
          import io
          import pandas as pd
          from gp_core import read_stock_report, COL_CODE, COL_NAME, COL_QTY
          from gp_invoice import canonicalize_invoice_rows

          rows = pd.DataFrame({
              'رمز المادة':['010716','010732','010733','TP3201-SP-17-16'],
              'اسم المادة':['Camera 10MP','128GB Memory','256GB Memory','Pump gasket'],
              'الكمية':[16,75,17,0],
          })
          b=io.BytesIO()
          with pd.ExcelWriter(b,engine='openpyxl') as w:
              rows.to_excel(w,index=False,sheet_name='جرد المواد')
              pd.DataFrame({'المستودع':['رئيسي طاقة - القبو']}).to_excel(w,index=False,sheet_name='رأسية التقرير')
          stock=read_stock_report(b.getvalue())
          assert stock[COL_CODE].tolist()==['010716','010732','010733','TP3201-SP-17-16']
          assert stock[COL_CODE].is_unique and stock[COL_CODE].ne('').all()
          ocr=[
              {'item_code':'521345','item_name':'','quantity':24511},
              {'item_code':'010716','item_name':'wrong','quantity':3},
              {'item_code':'010732','item_name':'','quantity':4},
              {'item_code':'010733','item_name':'','quantity':2},
              {'item_code':'338000','item_name':'','quantity':None},
          ]
          canonical, ignored=canonicalize_invoice_rows(ocr,stock,drop_unknown=True)
          assert [x['item_code'] for x in canonical]==['010716','010732','010733']
          assert [x['quantity'] for x in canonical]==[3,4,2]
          assert [x['item_name'] for x in canonical]==['Camera 10MP','128GB Memory','256GB Memory']
          assert ignored==['521345','338000']
          print('Warehouse code master/linking passed')
          PY
      - name: Test invoice OCR filter through app wrapper
        run: |
          python - <<'PY'
          import pandas as pd
          import gp_ocr
          from gp_core import ensure_unique_stock_keys
          stock=ensure_unique_stock_keys(pd.DataFrame([
              {'رمز المادة':'010716','اسم المادة':'Camera 10MP','الكمية':16},
              {'رمز المادة':'010732','اسم المادة':'128GB Memory','الكمية':75},
              {'رمز المادة':'010733','اسم المادة':'256GB Memory','الكمية':17},
          ]))
          gp_ocr._run_ocr_worker=lambda b:{
              'invoice_number':'8042','items':[
                  {'item_code':'521345','item_name':'','quantity':24511},
                  {'item_code':'010716','item_name':'','quantity':3},
                  {'item_code':'010732','item_name':'','quantity':4},
                  {'item_code':'010733','item_name':'','quantity':2},
                  {'item_code':'338000','item_name':'','quantity':None},
              ],'warnings':[],'printed_total_candidate':9}
          class F:
              name='invoice.jpeg'
              def getvalue(self): return b'test-image'
          result=gp_ocr.extract_invoice_data(F(),stock)
          assert [x['item_code'] for x in result['items']]==['010716','010732','010733']
          assert [x['quantity'] for x in result['items']]==[3,4,2]
          assert result['invoice_number']=='8042'
          assert any('521345' in x and '338000' in x for x in result['warnings'])
          print('OCR warehouse filtering passed')
          PY
      - name: Test warehouse terminology
        run: |
          python - <<'PY'
          import gp_ui
          gp_ui.set_language('ar')
          assert gp_ui.t('Inventory')=='إدارة المستودعات'
          assert gp_ui.t('Stock')=='المستودع'
          assert 'المخزون' not in gp_ui.t('Draft hint')
          assert 'المخزون' not in gp_ui.t('OCR hint')
          assert gp_ui.BUILD=='GP-CLOUD-v9'
          print('Warehouse terminology passed')
          PY
      - name: Smoke test lighter OCR engine and measure memory
        run: |
          /usr/bin/time -v python - <<'PY'
          import numpy as np
          from invoice_ocr_worker import get_engine
          engine=get_engine()
          image=np.full((700,500,3),255,dtype=np.uint8)
          result=engine(image,use_cls=False)
          assert result is not None
          print('Light OCR engine passed',type(result).__name__)
          PY
      - name: Reproduce OCR runtime on clean Python 3.11 slim with no apt packages
        run: |
          docker run --rm -v "$PWD:/app" -w /app python:3.11-slim bash -lc '
            python -m pip install --upgrade pip >/dev/null &&
            python -m pip install -r requirements.txt >/dev/null &&
            python scripts/v9_update.py &&
            /usr/bin/time -v python - <<"PY"
          import numpy as np
          from invoice_ocr_worker import get_engine
          result=get_engine()(np.full((700,500,3),255,dtype=np.uint8),use_cls=False)
          assert result is not None
          print("Clean slim lighter OCR passed")
          PY
          '
  publish-logo:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/cloud-v5-staging'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Assemble verified public asset
        run: python scripts/assemble_assets.py
      - name: Commit only the assembled logo to staging
        run: |
          git add -- assets/golden_palace.jpg
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: add checksum-verified Golden Palace logo'
          git push origin HEAD:cloud-v5-staging
