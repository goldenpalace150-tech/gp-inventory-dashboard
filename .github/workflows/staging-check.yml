name: Staging validation
on:
  push:
    branches: [cloud-v5-staging]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gp-staging-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify and assemble logo
        run: python scripts/assemble_assets.py
      - name: Install test dependencies without OCR models
        run: python -m pip install 'pytest>=8,<10' 'pandas>=2.2,<4' 'SQLAlchemy>=2.0.36,<3' 'cryptography>=44,<50' 'Pillow>=10.4,<13' 'openpyxl>=3.1.5,<4' xlrd==2.0.2
      - name: Compile application modules
        run: python -m compileall -q inventory_tracker.py gp_store.py gp_core.py gp_invoice.py gp_ocr.py gp_ui.py gp_reports.py gp_backup.py invoice_ocr_worker.py scripts
      - name: Run offline regression tests
        run: python -m pytest -o addopts='' -q
  publish-logo:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/cloud-v5-staging'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Assemble verified public asset
        run: python scripts/assemble_assets.py
      - name: Commit only the assembled logo to staging
        run: |
          git add -- assets/golden_palace.jpg
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: add checksum-verified Golden Palace logo'
          git push origin HEAD:cloud-v5-staging
