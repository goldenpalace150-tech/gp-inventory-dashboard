name: V16.4 simple invoice entry
on:
  push:
    branches: [feature/simple-invoice-entry-v16-4]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply updater
        run: python scripts/v16_4_simple_invoice_entry.py
      - name: Install requirements
        run: python -m pip install -r requirements.txt 'pytest>=8,<10'
      - name: Compile
        run: python -m compileall -q inventory_tracker.py gp_ui.py gp_store.py
      - name: Regression suite
        run: python -m pytest -o addopts='' -q
      - name: Validate markers
        run: |
          python - <<'PY'
          from pathlib import Path
          app=Path('inventory_tracker.py').read_text()
          ui=Path('gp_ui.py').read_text()
          assert 'st.radio(t("Invoice entry"),["AUTO","MANUAL"]' in app
          assert 'key="draft_selector"' not in app
          assert 'GP-CLOUD-v16.4' in ui
          print('v16.4 markers OK')
          PY
      - name: Commit validated source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inventory_tracker.py gp_ui.py tests/test_core_and_ocr.py
          git diff --cached --quiet || git commit -m 'feat: simplify invoice entry to auto or manual v16.4'
          git push
