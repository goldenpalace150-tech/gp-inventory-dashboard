name: V15.1 sidebar navigation fix
on:
  push:
    branches: [warehouse-shell-v15-navfix]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply v15.1 navigation fix
        run: python scripts/v15_1_navfix.py
      - name: Install requirements
        run: python -m pip install -r requirements.txt 'pytest>=8,<10'
      - name: Compile
        run: python -m compileall -q inventory_tracker.py gp_ui.py gp_ocr.py invoice_ocr_worker.py
      - name: Regression suite
        run: python -m pytest -o addopts='' -q
      - name: Validate navigation markers
        run: |
          python - <<'PY'
          from pathlib import Path
          app=Path('inventory_tracker.py').read_text()
          ui=Path('gp_ui.py').read_text()
          assert 'requested=st.session_state.pop("nav_request",None)' in app
          assert 'if "sidebar_nav" not in st.session_state or requested in nav:' in app
          assert 'st.session_state.get("sidebar_nav")!=desired' not in app
          assert 'st.session_state["nav_request"]="Invoices"' in app
          assert 'GP-CLOUD-v15.1' in ui
          print('v15.1 navigation markers OK')
          PY
      - name: Commit validated source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inventory_tracker.py gp_ui.py tests/test_core_and_ocr.py
          git diff --cached --quiet || git commit -m 'fix: sidebar navigation updates workspace v15.1'
          git push
