name: V12 warehouse validation 2
on:
  push:
    branches: [warehouse-update-v12]
    paths:
      - 'scripts/v12_warehouse_update.py'
      - 'scripts/v12_validate.py'
      - '.github/workflows/v12-validation-2.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: warehouse-update-v12
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/v12_warehouse_update.py
      - run: python -m pip install -r requirements.txt 'pytest>=8,<10'
      - run: python -m compileall -q inventory_tracker.py gp_store.py gp_ui.py gp_ocr.py invoice_ocr_worker.py
      - run: python -m pytest -o addopts='' -q
      - run: python scripts/v12_validate.py
      - name: Commit validated source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add requirements.txt inventory_tracker.py gp_store.py gp_ui.py gp_ocr.py invoice_ocr_worker.py assets/style.css
          if ! git diff --cached --quiet; then
            git commit -m 'feat: accessible forms invoice metadata OCR and force report delete'
            git push origin HEAD:warehouse-update-v12
          fi
