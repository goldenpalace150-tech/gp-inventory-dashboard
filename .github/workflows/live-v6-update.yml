name: Live v6 update

on:
  push:
    branches: [main]
    paths:
      - 'scripts/live_v6_update.py'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply source updates
        run: python scripts/live_v6_update.py
      - name: Install lightweight test dependencies
        run: python -m pip install 'pytest>=8,<10' 'pandas>=2.2,<4' 'SQLAlchemy>=2.0.36,<3' 'cryptography>=44,<50' 'Pillow>=10.4,<13' 'openpyxl>=3.1.5,<4' xlrd==2.0.2
      - name: Compile
        run: python -m compileall -q inventory_tracker.py gp_store.py gp_core.py gp_invoice.py gp_ocr.py gp_ui.py gp_reports.py gp_backup.py invoice_ocr_worker.py scripts
      - name: Regression tests
        run: python -m pytest -o addopts='' -q
      - name: Commit validated live source
        run: |
          git config user.name 'goldenpalace150-tech'
          git config user.email 'goldenpalace150@gmail.com'
          git add inventory_tracker.py gp_store.py gp_ui.py
          if git diff --cached --quiet; then
            echo 'No source changes required.'
          else
            git commit -m 'feat: faster bilingual v6 UI and tolerant stock import'
            git push origin HEAD:main
          fi
