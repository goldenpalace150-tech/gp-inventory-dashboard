[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opencv-python"
version = "4.11.0.86"
description = "Compatibility shim that satisfies RapidOCR while using opencv-python-headless"
requires-python = ">=3.8"
dependencies = ["opencv-python-headless==4.11.0.86"]
